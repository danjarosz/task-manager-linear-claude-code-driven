[package]
name = "linear-tasks"
version = "0.1.0"
edition = "2021"
description = "A terminal task manager powered by Linear, designed for annual, monthly, weekly, and daily planning"
authors = ["Daniel Jarosz"]
license = "MIT"

[dependencies]
# Async runtime
tokio = { version = "1.35", features = ["full"] }

# HTTP client
reqwest = { version = "0.11", features = ["json", "rustls-tls"], default-features = false }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# CLI argument parsing
clap = { version = "4.4", features = ["derive", "env"] }

# Terminal UI
crossterm = "0.27"
ratatui = "0.25"
tabled = { version = "0.15", features = ["ansi"] }

# Colors and styling
colored = "2.1"
console = "0.15"

# Date/time handling
chrono = { version = "0.4", features = ["serde"] }

# Error handling
anyhow = "1.0"
thiserror = "1.0"

# Configuration
dirs = "5.0"
toml = "0.8"

# Interactive prompts
dialoguer = { version = "0.11", features = ["fuzzy-select"] }
indicatif = "0.17"

# UUID
uuid = { version = "1.6", features = ["v4", "serde"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
